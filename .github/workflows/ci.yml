name: ci
on:
  pull_request:
    # The launch programme stacks branches on unmerged PRs (audit/*, task/*),
    # so CI must run for pull requests targeting those too. Without this a
    # stacked PR reports "no checks for this commit" and nothing is verified
    # before merge. Push events remain main-only.
    branches: [main, 'audit/**', 'task/**']
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    # Dummy build-time values so `next build` can prerender without real secrets.
    env:
      USE_MOCKS: 'true'
      NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy-anon-for-ci'
      NEXT_PUBLIC_SITE_URL: 'https://example.com'
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: 'pk_test_dummy'
      SUPABASE_SERVICE_ROLE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy-service-role-for-ci'
      # Phoenix WS6.2 — Sentry release tagging in CI (WS6.2)
      SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run validate:gap-ledger
      - run: npm run type-check
      - run: npm run lint
      # Phoenix contract rule 6: Jest must pass before merge. Runs before the
      # build so a logic regression fails fast, and so the suite never sees
      # .next/ output.
      - run: npm test
      # F-03 env gate: `npm run build` first runs scripts/prebuild-env-gate.js,
      # which enforces the full production env contract (scripts/validate-env.ts
      # --production) only when VERCEL_ENV=production. In GitHub CI the gate
      # self-skips by design: this job's dummy env + USE_MOCKS=true intentionally
      # violates that contract. The step below is the non-production, mock-aware
      # shape check, so env regressions CI *can* catch still fail here.
      - run: npm run validate-env
      # PERF-PHASE3-3 — save build output so the budget gate can parse it.
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
      # PERF-PHASE3-3 — Bundle budget gate. Checks "First Load JS shared by all"
      # from Next.js build output (not individual chunk files, which include large
      # page-specific lazy chunks like recharts). Budget: 150 kB.
      - name: Bundle budget check (First Load JS shared by all < 150 kB)
        run: |
          set -e
          SHARED_LINE=$(grep "First Load JS shared by all" /tmp/build.log | tail -1)
          if [ -z "$SHARED_LINE" ]; then
            echo "Could not find 'First Load JS shared by all' in build output — skipping"
            exit 0
          fi
          SIZE_KB=$(echo "$SHARED_LINE" | grep -oE '[0-9]+\.?[0-9]* kB' | head -1 | sed 's/ kB//')
          SIZE_BYTES=$(awk "BEGIN{printf \"%d\", $SIZE_KB * 1024}")
          BUDGET_BYTES=153600  # 150 kB
          echo "First Load JS shared by all: ${SIZE_KB} kB (~${SIZE_BYTES} bytes)"
          if [ "$SIZE_BYTES" -gt "$BUDGET_BYTES" ]; then
            echo "FAIL: shared bundle exceeds 150 kB budget (${SIZE_KB} kB > 150 kB)"
            echo "Run ANALYZE=true npm run build locally to investigate."
            exit 1
          else
            echo "OK: shared bundle within 150 kB budget"
          fi
